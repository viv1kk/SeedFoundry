<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeedFactory</title>
    <script>
      // Set the theme before the first paint: the same rule as src/theme.ts initialTheme().
      ;(function () {
        var theme = null
        try {
          theme = window.localStorage.getItem('seedfoundry.theme')
        } catch (e) {}
        // Dark is the presentation default (ValueWise house style, D-96).
        if (theme !== 'light' && theme !== 'dark') theme = 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
